<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hotpotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <radialGradient id="soupGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="70%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hotpotBg)" />
  <!-- Table -->
  <ellipse cx="400" cy="450" rx="350" ry="120" fill="#1E293B" />
  <!-- Hotpot bowl -->
  <ellipse cx="400" cy="420" rx="190" ry="75" fill="#475569" stroke="#94A3B8" stroke-width="4" />
  <ellipse cx="400" cy="415" rx="170" ry="60" fill="url(#soupGlow)" />
  <!-- Divider -->
  <path d="M 270 415 Q 400 395 530 415" stroke="#FFFFFF" stroke-width="5" fill="none" opacity="0.6" />
  <!-- Veggies & dumplings -->
  <circle cx="340" cy="415" r="14" fill="#22C55E" />
  <circle cx="370" cy="425" r="16" fill="#FBBF24" />
  <circle cx="430" cy="410" r="15" fill="#F87171" />
  <circle cx="460" cy="420" r="18" fill="#FBBF24" />
  <!-- Steam clouds -->
  <path d="M 330 350 Q 350 300 330 260 T 360 200" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round" />
  <path d="M 400 340 Q 420 280 390 240 T 430 180" stroke="#FFFFFF" stroke-width="8" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 470 350 Q 450 290 480 250 T 460 190" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round" />
  <text x="50%" y="80" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="2">HOTPOT NIGHT</text>
  <text x="50%" y="115" text-anchor="middle" fill="#F8FAFC" opacity="0.75" font-family="sans-serif" font-size="16">Bữa lẩu cứu vớt tâm hồn sau chuỗi deadline</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A1A" />
      <stop offset="60%" stop-color="#1E1035" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
    <radialGradient id="lampLight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#CA8A04" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#nightBg)" />
  <circle cx="400" cy="220" r="240" fill="url(#lampLight)" />
  <!-- Coffee cups on table -->
  <rect x="250" y="420" width="300" height="15" rx="5" fill="#475569" />
  <rect x="385" y="435" width="30" height="130" fill="#334155" />
  <!-- Cups -->
  <rect x="330" y="375" width="45" height="45" rx="6" fill="#38BDF8" />
  <rect x="425" y="370" width="45" height="50" rx="6" fill="#F472B6" />
  <!-- Steam -->
  <path d="M 350 360 Q 360 340 350 325" stroke="#E2E8F0" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 445 355 Q 455 335 445 320" stroke="#E2E8F0" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
  <!-- Moon & stars -->
  <path d="M 680 80 A 35 35 0 0 0 720 120 A 40 40 0 1 1 680 80 Z" fill="#FDE047" opacity="0.9" />
  <circle cx="160" cy="140" r="2.5" fill="#FFF" opacity="0.9" />
  <circle cx="230" cy="90" r="2" fill="#FFF" opacity="0.7" />
  <circle cx="560" cy="110" r="3" fill="#FFF" opacity="0.9" />
  <text x="50%" y="80" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="2">LATE NIGHT CHATS</text>
  <text x="50%" y="115" text-anchor="middle" fill="#F8FAFC" opacity="0.75" font-family="sans-serif" font-size="16">Cà phê vỉa hè &amp; chuyện nhân sinh 2h sáng</text>
</svg>

